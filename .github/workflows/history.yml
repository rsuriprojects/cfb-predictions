name: fetch history

# Downloads past seasons for building and backtesting the model. Run by hand.
# The data is uploaded as an artifact, not committed.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated seasons (blank = 2014 through 2026)"
        default: ""
      only:
        description: "Comma-separated endpoint names to fetch (blank = all)"
        default: ""

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: fetch
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASONS: ${{ inputs.seasons }}
          ONLY: ${{ inputs.only }}
        run: python fetch_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: cfbd-history
          path: data/raw/
          retention-days: 30
